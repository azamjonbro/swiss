  <!-- SwissWatch Premium — favicon.

       Not the house mark. At 16px, and masked to a circle the way search
       results and browser UI show it, the four-panel mark reduces to a red
       disc with a white cross: the Swiss flag, not a boutique. This monogram
       is the mark's job at sizes the mark cannot do — the full mark still
       stands everywhere it has room (BrandMark.vue, apple-touch-icon).

       The letterforms are DM Sans at weight 500, the storefront's own face,
       converted to outlines so no renderer has to have the font. Regenerate
       with fontTools if the typeface ever changes. -->
