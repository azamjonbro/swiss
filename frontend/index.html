<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The settled page, not the intro panel that briefly covers it: light is
         the default theme (src/stores/theme.ts), so this is --bg. -->
    <meta name="theme-color" content="#fdfcfa" />

    <!-- The intro panel below is a full-screen opaque overlay, and every route
         ships a prerendered copy of its own content underneath it. Playing it on
         every page view meant that content was hidden until the whole bundle had
         booted — the one thing prerendering exists to avoid. It now plays once
         per session: the first view gets the intro, every navigation and reload
         after it paints the real page immediately. -->
    <script>
      try {
        if (sessionStorage.getItem('sw-intro') === 'done') {
          document.documentElement.classList.add('sw-intro-done');
        }
      } catch (e) {
        /* storage disabled — fall through and play the intro */
      }
    </script>
    <!-- Fallback head only. Every route ships a prerendered copy of this file
         with its own title, description, canonical, Open Graph tags and
         JSON-LD (scripts/prerender.mjs), and the running app rewrites the same
         tags on navigation (src/utils/seo.ts). -->
    <meta name="description" content="Authenticated timepieces in Tashkent, Uzbekistan. Browse automatic and quartz watches from the maisons SwissWatch Premium represents — discover, inquire, acquire." />
    <link rel="canonical" href="https://swisswatchpremium.uz/" />
    <meta property="og:site_name" content="SwissWatch Premium" />
    <title>SwissWatch Premium</title>

    <!-- DM Sans, self-hosted. The Google Fonts stylesheet was render-blocking
         on a third-party origin: two extra connections before a single glyph
         could be requested. These are the same variable woff2 files Google
         serves (v17), copied into /assets so they ship with the immutable
         cache header in vercel.json — the rendered typography is unchanged.
         Only the upright latin file is preloaded: it carries every weight the
         page uses above the fold. latin-ext and italic load on demand. -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/assets/fonts/dm-sans-v17-latin.woff2"
      crossorigin
    />

    <!-- The hero photograph is the LCP element on the homepage; start it in
         parallel with the module graph instead of after it. -->
    <!-- The candidate list has to match the one SmartImage builds from
         src/data/image-widths.json. Preloading the bare full-size file while
         the element resolves to a narrower variant downloads both and preloads
         neither usefully, so the set is mirrored here. -->
    <link
      rel="preload"
      as="image"
      href="/images/swisswatch_hero.webp"
      imagesrcset="/images/swisswatch_hero-480.webp 480w, /images/swisswatch_hero-960.webp 960w, /images/swisswatch_hero.webp 1376w"
      imagesizes="100vw"
      type="image/webp"
      fetchpriority="high"
    />

    <style>
      /* One variable file per subset — the same asset Google returns for the
         400/500/600/700 request, so `font-weight: 100 1000` is the honest
         declaration and no synthetic bolding is introduced. */
      @font-face {
        font-family: 'DM Sans';
        font-style: normal;
        font-weight: 100 1000;
        font-display: swap;
        src: url('/assets/fonts/dm-sans-v17-latin.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'DM Sans';
        font-style: normal;
        font-weight: 100 1000;
        font-display: swap;
        src: url('/assets/fonts/dm-sans-v17-latin-ext.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0,
          U+2113, U+2C60-2C7F, U+A720-A7FF;
      }
      @font-face {
        font-family: 'DM Sans';
        font-style: italic;
        font-weight: 100 1000;
        font-display: swap;
        src: url('/assets/fonts/dm-sans-v17-latin-italic.woff2') format('woff2');
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC,
          U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215,
          U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: 'DM Sans';
        font-style: italic;
        font-weight: 100 1000;
        font-display: swap;
        src: url('/assets/fonts/dm-sans-v17-latin-ext-italic.woff2') format('woff2');
        unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304,
          U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0,
          U+2113, U+2C60-2C7F, U+A720-A7FF;
      }

      /* Second and later views in a session: no panel at all, so the
         prerendered markup is the first paint. */
      .sw-intro-done #sw-preloader {
        display: none;
      }

      #sw-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #0a0a0a;
        opacity: 1;
        transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.7s;
      }
      #sw-preloader.sw-preloader--done {
        opacity: 0;
        pointer-events: none;
      }
      body.sw-loading {
        overflow: hidden;
      }
      .sw-preloader__ring {
        position: relative;
        width: 84px;
        height: 84px;
        display: grid;
        place-items: center;
      }
      .sw-preloader__svg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      .sw-preloader__track {
        fill: none;
        stroke: rgba(243, 239, 231, 0.14);
        stroke-width: 1;
      }
      .sw-preloader__sweep {
        fill: none;
        stroke: #ad2b39;
        stroke-width: 1.4;
        stroke-linecap: round;
        stroke-dasharray: 339.3;
        stroke-dashoffset: 300;
        transform-origin: 60px 60px;
      }
      .sw-preloader__mark {
        display: block;
        width: 30px;
        height: 30px;
      }
      .sw-preloader__word {
        display: flex;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-size: clamp(9px, 2.6vw, 12px);
        font-weight: 500;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        color: #f3efe7;
      }
      .sw-preloader__word span {
        opacity: 0;
        transform: translateY(6px);
      }
      .sw-preloader__eyebrow {
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        font-style: italic;
        font-size: 13px;
        letter-spacing: 0.06em;
        color: #6f6a63;
        opacity: 0;
      }
      @media (prefers-reduced-motion: no-preference) {
        .sw-preloader__svg {
          animation: sw-rotate 2.4s linear infinite;
        }
        .sw-preloader__word span {
          animation: sw-letter-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .sw-preloader__word span:nth-child(1) { animation-delay: 0.15s; }
        .sw-preloader__word span:nth-child(2) { animation-delay: 0.19s; }
        .sw-preloader__word span:nth-child(3) { animation-delay: 0.23s; }
        .sw-preloader__word span:nth-child(4) { animation-delay: 0.27s; }
        .sw-preloader__word span:nth-child(5) { animation-delay: 0.31s; }
        .sw-preloader__word span:nth-child(6) { animation-delay: 0.35s; }
        .sw-preloader__word span:nth-child(7) { animation-delay: 0.39s; }
        .sw-preloader__word span:nth-child(8) { animation-delay: 0.43s; }
        .sw-preloader__word span:nth-child(9) { animation-delay: 0.47s; }
        .sw-preloader__word span:nth-child(10) { animation-delay: 0.51s; }
        .sw-preloader__word span:nth-child(11) { animation-delay: 0.55s; }
        .sw-preloader__word span:nth-child(12) { animation-delay: 0.59s; }
        .sw-preloader__word span:nth-child(13) { animation-delay: 0.63s; }
        .sw-preloader__word span:nth-child(14) { animation-delay: 0.67s; }
        .sw-preloader__word span:nth-child(15) { animation-delay: 0.71s; }
        .sw-preloader__word span:nth-child(16) { animation-delay: 0.75s; }
        .sw-preloader__word span:nth-child(17) { animation-delay: 0.79s; }
        .sw-preloader__word span:nth-child(18) { animation-delay: 0.83s; }
        .sw-preloader__eyebrow {
          animation: sw-letter-in 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
          animation-delay: 0.88s;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sw-preloader__word span,
        .sw-preloader__eyebrow {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes sw-rotate {
        to { transform: rotate(360deg); }
      }
      @keyframes sw-letter-in {
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="sw-preloader">
      <div class="sw-preloader__ring">
        <svg class="sw-preloader__svg" viewBox="0 0 120 120">
          <circle class="sw-preloader__track" cx="60" cy="60" r="54" />
          <circle class="sw-preloader__sweep" cx="60" cy="60" r="54" />
        </svg>
        <!-- The house mark, geometry shared with BrandMark.vue: same five paths,
             traced from the boutique's own logo artwork. -->
        <svg class="sw-preloader__mark" viewBox="0 0 40 40" aria-hidden="true">
          <rect width="40" height="40" fill="#f3efe7" />
          <path d="M0 0L16.06 0 16.74 16.74 15.2 16.97 1.26 17.6 16.57 18.29 16.86 18.46 16.86 21.14 0 20.46Z" fill="#ad2b39" />
          <path d="M40 0L40 15.89 23.14 16.57 22.29 1.54 21.66 16.46 21.2 16.69 18.74 16.69 19.43 0Z" fill="#ad2b39" />
          <path d="M21.43 21.31L18.86 21.31 18.57 21.14 18.69 18.46 21.43 18.51Z" fill="#ad2b39" />
          <path d="M40 40L24.06 40 23.31 23.03 24.8 22.8 38.46 22.17 23.43 21.49 23.26 21.26 23.2 18.63 40 19.31Z" fill="#ad2b39" />
          <path d="M0 40L0 23.89 17.03 23.26 17.77 38.51 18.46 23.37 18.69 23.09 21.31 23.09 20.63 40Z" fill="#ad2b39" />
        </svg>
      </div>
      <div class="sw-preloader__word">
        <span>S</span><span>W</span><span>I</span><span>S</span><span>S</span><span>W</span><span>A</span><span>T</span><span>C</span><span>H</span><span>&nbsp;</span><span>P</span><span>R</span><span>E</span><span>M</span><span>I</span><span>U</span><span>M</span>
      </div>
      <div class="sw-preloader__eyebrow">Time, Refined</div>
    </div>
    <script>
      if (!document.documentElement.classList.contains('sw-intro-done')) {
        document.body.classList.add('sw-loading');
        // The panel must never outlive the boot it is covering. `main.ts` hides
        // it the frame after mount; this is the floor for the case where the
        // bundle 404s, a chunk stalls or JavaScript is off entirely — without
        // it, a failed boot leaves a visitor staring at an opaque panel with
        // fully rendered content sitting behind it.
        setTimeout(function () {
          document.body.classList.remove('sw-loading');
          var el = document.getElementById('sw-preloader');
          if (el) el.classList.add('sw-preloader--done');
        }, 2500);
      }
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
